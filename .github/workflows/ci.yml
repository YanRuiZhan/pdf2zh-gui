name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Byte-compile the GUI and installers
        run: python -m compileall -q pdf2zh_gui.py pdf2zh_core.py scripts

      - name: Validate shell launchers
        shell: bash
        run: bash -n install.sh run_pdf2zh.sh

      - name: Run core tests
        run: python -m pytest tests -q
